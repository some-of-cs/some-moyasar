name: CI

on:
  push:
    branches: [ main, "module-*", "story-*", "unit-*", "feat/*" ]
  pull_request:
    branches: [ main, "module-*", "story-*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default features
        run: cargo check

      - name: Check no-default-features (core only)
        run: cargo check --no-default-features --features core

      - name: Check all features
        run: cargo check --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests (all features)
        run: cargo test --lib --all-features

      - name: Run integration tests (all features)
        run: cargo test --tests --all-features

      - name: Run doc tests (all features)
        run: cargo test --doc --all-features
