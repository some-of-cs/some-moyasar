name: CI

on:
  push:
    branches: [ main, "module-*", "story-*", "unit-*", "feat/*" ]
  pull_request:
    branches: [ main, "module-*", "story-*" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default features
        run: cargo check

      - name: Check no-default-features (core only)
        run: cargo check --no-default-features --features core

      - name: Check all features
        run: cargo check --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests (all features)
        run: cargo test --lib --all-features

      - name: Run integration tests (all features)
        run: cargo test --tests --all-features

      - name: Run doc tests (all features)
        run: cargo test --doc --all-features
