name: Rust CI

on:
  push:
    branches: [main, "feat/**", "patch/**"]
  pull_request:
    branches: [main, "feat/**", "patch/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check standalone core feature
        run: cargo check --no-default-features --features core

      - name: Check core + payment-intents features
        run: cargo check --no-default-features --features "core,payment-intents"

      - name: Check core + payments features
        run: cargo check --no-default-features --features "core,payments"

      - name: Check Module 4 individual & umbrella features
        run: |
          cargo check --no-default-features --features "core,tokens"
          cargo check --no-default-features --features "core,invoices"
          cargo check --no-default-features --features "core,card-auths"
          cargo check --no-default-features --features tokens
          cargo check --no-default-features --features invoices
          cargo check --no-default-features --features card-auths
          cargo check --no-default-features --features card-auth
          cargo check --no-default-features --features tokens-invoices-3ds

      - name: Check Module 5 payouts feature
        run: |
          cargo check --no-default-features --features "core,payouts"
          cargo check --no-default-features --features payouts

      - name: Check Module 6 settlements-ledger & alias features
        run: |
          cargo check --no-default-features --features "core,settlements-ledger"
          cargo check --no-default-features --features settlements-ledger
          cargo check --no-default-features --features settlements

      - name: Check Module 7 sources, webhooks-api & webhook-engine features
        run: |
          cargo check --no-default-features --features "core,webhook-engine"
          cargo check --no-default-features --features "core,sources"
          cargo check --no-default-features --features "core,webhooks-api"
          cargo check --no-default-features --features "core,sources-webhooks"
          cargo check --no-default-features --features sources-webhooks

      - name: Check default library target
        run: cargo check --lib

      - name: Run Clippy with -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run library unit & integration tests
        run: cargo test --lib

      - name: Run doc-tests (including compile_fail guards)
        run: cargo test --doc
