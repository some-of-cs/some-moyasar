[package]
name = "some-moyasar"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Idiomatic, microkernel-architected Rust SDK and constant-time webhook verification engine for the Moyasar Payment Gateway"
readme = "README.md"
homepage = "https://github.com/some-of-cs/some-moyasar"
documentation = "https://docs.rs/some-moyasar"
repository = "https://github.com/some-of-cs/some-moyasar"
keywords = ["moyasar", "payments", "saudi-arabia", "mada", "fintech"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous", "authentication"]
include = ["src/**/*", "examples/**/*", "Cargo.toml", "LICENSE", "README.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = [
  "core",
  "env-keys",
  "payments",
  "payment-intents",
  "tokens-invoices-3ds",
  "settlements-ledger",
  "payouts",
  "sources-webhooks",
]
core = []
env-keys = []
payments = ["core"]
payment-intents = ["core"]
tokens = ["core"]
invoices = ["core"]
card-auths = ["core"]
card-auth = ["card-auths"]
tokens-invoices-3ds = ["tokens", "invoices", "card-auths"]
settlements-ledger = ["core"]
settlements = ["settlements-ledger"]
payouts = ["core"]
sources = ["core"]
webhooks-api = ["core", "webhook-engine"]
webhook-engine = ["core", "dep:hmac", "dep:sha2", "dep:subtle"]
sources-webhooks = ["sources", "webhooks-api", "webhook-engine"]
stripe-compat = ["core", "payments", "tokens", "invoices"]
unified-gateway = ["core", "payments", "payment-intents", "tokens", "payouts", "webhook-engine"]
some-payments-trait = ["unified-gateway"]
some-payment-trait = ["some-payments-trait"]
some-payment-adapter = ["dep:some-payment-core", "dep:async-trait", "unified-gateway", "invoices"]
async-stream = ["core"]
test-utils = ["core", "dep:wiremock"]
full = [
  "core",
  "env-keys",
  "payments",
  "payment-intents",
  "tokens",
  "invoices",
  "card-auths",
  "payouts",
  "settlements-ledger",
  "sources",
  "webhooks-api",
  "webhook-engine",
  "stripe-compat",
  "unified-gateway",
  "some-payments-trait",
  "some-payment-trait",
  "async-stream",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hmac = { version = "0.12", optional = true }
http = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
some-payment-core = { git = "https://github.com/some-of-cs/some-payment", package = "some-payment-core", optional = true }
subtle = { version = "2.6", optional = true }
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
wiremock = { version = "0.6", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
actix-rt = "2"
actix-web = "4"
axum = "0.8"
rocket = { version = "0.5", features = ["json"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
prost = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
wiremock = "0.6"

[[example]]
name = "axum_server"
path = "examples/axum/main.rs"
required-features = ["full"]

[[example]]
name = "actix_server"
path = "examples/actix/main.rs"
required-features = ["full"]

[[example]]
name = "rocket_server"
path = "examples/rocket/main.rs"
required-features = ["full"]

[[test]]
name = "cross_cutting_integration"
path = "tests/cross_cutting_integration.rs"
required-features = ["unified-gateway", "stripe-compat", "test-utils"]

[[test]]
name = "axum_integration"
path = "tests/axum_integration.rs"
required-features = ["full", "test-utils"]

[[test]]
name = "actix_integration"
path = "tests/actix_integration.rs"
required-features = ["full", "test-utils"]

[[test]]
name = "rocket_integration"
path = "tests/rocket_integration.rs"
required-features = ["full", "test-utils"]

[[example]]
name = "tonic_grpc_server"
path = "examples/tonic/main.rs"
required-features = ["full"]

[[test]]
name = "tonic_integration"
path = "tests/tonic_integration.rs"
required-features = ["full", "test-utils"]
