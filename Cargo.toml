[package]
name = "some-moyasar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Idiomatic, microkernel-architected Rust SDK for the Moyasar Payment Gateway"
repository = "https://github.com/some-of-cs/some-moyasar"

[features]
default = ["core", "env-keys", "payments", "payment-intents", "tokens-invoices-3ds", "settlements-ledger", "payouts", "sources-webhooks"]
core = []
env-keys = []
payments = ["core"]
payment-intents = ["core"]
tokens = ["core"]
invoices = ["core"]
card-auths = ["core"]
card-auth = ["card-auths"]
tokens-invoices-3ds = ["tokens", "invoices", "card-auths"]
settlements-ledger = ["core"]
settlements = ["settlements-ledger"]
payouts = ["core"]
sources = ["core"]
webhooks-api = ["core", "webhook-engine"]
webhook-engine = ["core", "dep:hmac", "dep:sha2", "dep:subtle"]
sources-webhooks = ["sources", "webhooks-api", "webhook-engine"]
stripe-compat = ["core", "payments", "tokens"]
unified-gateway = ["core", "payments", "payment-intents", "tokens", "webhook-engine"]
some-payments-trait = ["unified-gateway"]
test-utils = ["core", "dep:wiremock"]
full = ["core", "env-keys", "payments", "payment-intents", "tokens", "invoices", "card-auths", "payouts", "settlements-ledger", "sources", "webhooks-api", "webhook-engine", "stripe-compat", "unified-gateway"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hmac = { version = "0.12", optional = true }
http = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
wiremock = { version = "0.6", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
