[package]
name = "some-moyasar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Idiomatic, microkernel-architected Rust SDK for the Moyasar Payment Gateway"
repository = "https://github.com/some-of-cs/some-moyasar"

[features]
default = ["core", "env-keys"]
core = []
env-keys = []
tokens = ["core"]
invoices = ["core"]
card-auths = ["core"]
tokens-invoices-3ds = ["tokens", "invoices", "card-auths"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
